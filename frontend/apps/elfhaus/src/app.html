<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Elfhaus</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<link rel="preload" href="%sveltekit.assets%/fonts/Cinzel-VF.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Nunito-VF.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Montserrat-VF.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="theme-color" content="#2A1810" />
		<style>html,body{background:#2A1810;margin:0}
			/* L1: branded first paint (inline, before any JS): the ELFHAUS logo + a flat gold progress bar; hidden under the studio sting, back until the intro is up */
			#preL{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);
				background:#2A1810;pointer-events:none;opacity:0;animation:preIn .3s ease-out .12s forwards}
			#preL img{width:min(62vw,460px);height:auto}
			#preL .pb{width:min(48vw,300px);height:10px;border-radius:6px;background:#FBF3E4;overflow:hidden;border:3px solid #26140F}
			#preL .pb i{display:block;width:40%;height:100%;border-radius:3px;background:#F2B935;animation:preBar 1.1s ease-in-out infinite}
			#preL.out{animation:preOut .2s ease-in forwards}
			#preL.hold{animation:none;opacity:0} body:has(#loader.pxOn) #preL,body:has(#loader.ready) #preL,body:has(#loader.out) #preL{display:none}
			@keyframes preIn{to{opacity:1}} @keyframes preOut{from{opacity:1}to{opacity:0}} @keyframes preBar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
			@media (prefers-reduced-motion:reduce){#preL .pb i{animation:none;width:100%;opacity:.6}}
		</style>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="stylesheet" href="%sveltekit.assets%/elfhaus.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/resub-fix.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/board.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/symrig.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/chalet.css" />
		%sveltekit.head%
	</head>
	<body>
		<div id="preL" aria-hidden="true"><img src="%sveltekit.assets%/art/logo.webp" alt="" /><div class="pb"><i></i></div></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
